<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小睿经纪 - 房产服务首页 UI 设计稿</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: #edf5f1;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at top left, rgba(13, 148, 112, .2), transparent 30%),
        linear-gradient(135deg, #e8f8f2 0%, #f8fbff 100%);
    }

    main {
      width: min(100%, 430px);
    }

    .frame {
      width: 100%;
      border: 0;
      border-radius: 28px;
      box-shadow: 0 28px 80px rgba(6, 66, 52, .2);
      background: white;
      display: block;
    }

    .caption {
      margin: 18px 0 0;
      text-align: center;
      color: #315246;
      font-size: 14px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main aria-label="小睿经纪房产服务首页 UI 设计稿预览">
    <img class="frame" src="assets/xiaorui-real-estate-ui.svg" alt="小睿经纪房产服务首页高保真 UI 设计稿" />
    <p class="caption">小睿经纪 App 首页 UI 设计稿：绿色房产服务品牌、搜索入口、品质看房主视觉、业务快捷入口与底部导航。</p>
  </main>
</body>
</html>
